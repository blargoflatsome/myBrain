[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every page the app has is served by index.html with status 200 (Vue Router shows it).
# Anything else gets the app's Page not found with status 404 (docs/SPEC.md §8 Search listing and 404s).
# A new route needs a line here; src/tests/unit/seo/seo.test.ts fails otherwise. Files (assets, icons) are served first.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/help"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/tasks"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/capture"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/routines"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/routines/:id/run"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/journal"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/vault"
  to = "/index.html"
  status = 200
[[redirects]]
